[package]
name = "dnsctl"
version = "0.1.1"
edition = "2024"
build = "../build.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
csv = "1.4.0"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "rustls"] }
serde_json = "1.0.151"

[[bin]]
name = "dnsuck"
path = "src/main.rs"

[build-dependencies]
time = { version = "0.3.55", features = ["formatting"] }
